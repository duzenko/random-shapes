<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игры</title>
<style>
  :root { --bg:#f4f1ea; --line:#d9d2c5; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
    color: #2b2b2b;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 18px;
  }
  h1 { margin: 0 0 24px; font-size: 28px; }
  .menu {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 760px;
  }
  .tile {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,.06);
    padding: 22px 20px;
    text-decoration: none;
    color: inherit;
    text-align: center;
    transition: transform .1s, box-shadow .1s;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.1); }
  .emo {
    font-size: 56px;
    line-height: 1;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  }
  .name { font-size: 20px; font-weight: 600; margin-top: 10px; }
  .desc { font-size: 14px; color: #777; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Игры</h1>
  <div class="menu">
    <a class="tile" href="shapes.html">
      <div class="emo">🔺</div>
      <div class="name">Случайные фигуры</div>
      <div class="desc">Форма, цвет и размер</div>
    </a>
    <a class="tile" href="barabashka.html">
      <div class="emo">👻</div>
      <div class="name">Барабашка</div>
      <div class="desc">Найди правильный предмет</div>
    </a>
    <a class="tile" href="sortirovka.html">
      <div class="emo">♻️</div>
      <div class="name">Сортировка мусора</div>
      <div class="desc">Стекло, бумага, пластик, дерево</div>
    </a>
  </div>
</body>
</html>
